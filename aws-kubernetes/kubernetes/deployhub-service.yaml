apiVersion: v1
kind: Service
metadata:
  name: deployhub-service
  namespace: default
  labels:
    app: deployhub
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb" # AWS Network Load Balancer (NLB) integration
spec:
  type: LoadBalancer
  selector:
    app: deployhub
  ports:
    - name: http
      port: 80
      targetPort: 3000

