services:
  deployhub:
    build:
      context: ../..
      dockerfile: aws-kubernetes/docker/Dockerfile
    container_name: deployhub-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # Mount Docker socket for container builds
      - ~/.kube/config:/root/.kube/config:ro     # Mount host kubeconfig for cluster deployments
      - deployhub-data:/app/backend/data
    env_file:
      - ../../backend/.env
    environment:
      - PORT=3000
      - FRONTEND_DIR=/app/frontend

volumes:
  deployhub-data:

